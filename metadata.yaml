---
title: "Ozone Watch"
project_id: "OzoneWatch"
project_type: "application"
description: "Ozone Watch is designed to help users keep track of ozone concentrations reported during the current ozone season and understand the possible implications for attainment of the National Ambient Air Quality Standards (NAAQS) for ozone during the current 3-year design value period. The information in Ozone Watch is based on ozone concentration data reported to the EPA's Air Quality System (AQS) database, combined with real-time ozone concentration data reported to the EPA's AirNow database on days where the data have not yet been submitted to AQS."

url: "https://www.epa.gov/outdoor-air-quality-data/ozone-watch"
status: "active"
created: "2022-04-20"
last_updated: "2026-10-28"

owner:
  name: "Ben Wells"
  organization: "US EPA"
  contact: "wells.benjamin@epa.gov"
  github: "bentwells"

maintainers: "Ben Wells"

repository:
