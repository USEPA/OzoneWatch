  license: ""

software:
  languages: "R"
  dependencies: ["DT","pins","plyr","reshape2","sf","shiny"]
  environment: "DMAP public and staging servers"

data:
  sources: ["AQS","AirNow"]
  access_notes: "Retrieves AQS data and AirNow data stored in AQS, merges them and calculates preliminary ozone DVs"
  classification: "public"

outputs:
